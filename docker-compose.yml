# Shared environment blocks.
#
# Anchors (the `&name` / `*name` syntax) let backend-api and backend-worker
# share one definition instead of repeating it. Compose merges them with the
# YAML merge key `<<`, so a change to the S3 config can never drift between the
# two services. The `x-` prefix marks these as extension fields: Compose skips
# them as services.
x-storage-env: &storage-env
  STORAGE_DRIVER: s3
  # Internal address: resolved by Docker/Podman DNS, never by the browser.
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage:8333}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-riskio-avatars}
  # SeaweedFS accepts any credentials by default. Override both in .env when
  # pointing at a real S3 (AWS, MinIO) so the compose file stays provider-agnostic.
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-any}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-any}
  # Public address: what the browser uses to render an avatar. Different from
  # STORAGE_ENDPOINT on purpose, and the only one that needs a host-visible port.
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:${STORAGE_PORT:-8333}/${STORAGE_BUCKET:-riskio-avatars}}

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  CACHE_DRIVER: ${CACHE_DRIVER:-redis}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  # Outbound email, used only for the password reset link. `log` keeps the link
  # in the backend log instead of sending it, which is fine locally and unsafe
  # anywhere else. Set MAIL_TRANSPORT=smtp plus the SMTP_* values to send for
  # real; the API refuses to boot on smtp with an incomplete configuration.
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-riskio@example.com}
  # Telemetry. Both processes speak OTLP to the collector and nothing else, so
  # pointing traces at CloudWatch or X-Ray later is a change to the collector's
  # config and not to the app. service.name is fixed here so the service
  # extractions in Fase 6 do not relabel data that already exists.
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-riskio-api}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1}
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}

services:
  db:
    image: postgis/postgis:16-3.4
    runtime: runc
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only: reachable from the host for psql, not from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - core
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: docker.io/chrislusf/seaweedfs
    runtime: runc
    restart: unless-stopped
    # -ip.bind=0.0.0.0 is required: without it SeaweedFS binds a single
    # interface (whichever it detects last) instead of 0.0.0.0, so a service
    # attached only to the `core` network — the worker — gets ECONNREFUSED
    # while the API, on both networks, appears to work. -ip is left on
    # autodetect because that is the address SeaweedFS advertises to its own
    # master/volume/filer peers.
    command: server -s3 -s3.port=8333 -volume.max=100 -ip.bind=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8333/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Published on all interfaces on purpose: this is the only storage
      # address the browser can reach (STORAGE_PUBLIC_URL).
      - "${STORAGE_PORT:-8333}:8333"
    networks:
      # core so the API can talk to it by DNS, edge so it is reachable
      # from outside the host.
      - core
      - edge
    volumes:
      - storage_data:/data

  redis:
    image: docker.io/library/redis:7-alpine
    runtime: runc
    restart: unless-stopped
    ports:
      # Loopback only: no auth on a dev Redis, so never expose it broadly.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - core
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    restart: unless-stopped
    env_file: .env
    environment:
      <<: [*storage-env, *backend-env]
      PORT: 3000
    ports:
      - "${BACKEND_API_PORT:-3000}:3000"
    networks:
      - core
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    command: ["npm", "run", "start:worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: [*storage-env, *backend-env]
      IS_WORKER: "true"
      # A distinct service name, or the worker's traces and the API's are
      # indistinguishable in Jaeger. The worker is the one that talks to NOAA,
      # which makes it the more interesting of the two.
      OTEL_SERVICE_NAME: ${OTEL_WORKER_SERVICE_NAME:-riskio-worker}
    networks:
      # core only: the worker has no HTTP listener, so nothing outside needs
      # to reach it.
      - core
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        # The browser is not inside the compose network, so it sends to the
        # collector's loopback port. Empty disables browser tracing entirely:
        # the SDK is compiled in either way, it just does not register.
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
    runtime: runc
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      # edge only: the SPA can reach the API, never the database or Redis.
      - edge
    depends_on:
      backend-api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel/config.yaml:ro,z
      # Per-container metrics via the podman socket are deliberately absent.
      # They were tried and do not work here: SELinux denies a container access
      # to /run/user/1000/podman/podman.sock even as root, and one broken
      # receiver takes the whole collector down with it, taking traces and host
      # metrics with it. Per-service resource usage is still available from the
      # app side: the Node runtime metrics that ship with auto-instrumentations
      # report process CPU and heap per service.
    networks:
      - core
    ports:
      # OTLP over HTTP on loopback, so the browser can send traces too
      # (Fase 6.2). Nothing is exposed off the host.
      - "127.0.0.1:${OTEL_PORT:-4318}:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    networks:
      - core

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - core

  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/loki.yml:/etc/loki/loki.yml:ro,z
      - loki_data:/loki
    networks:
      - core

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - core

networks:
  # Data tier. Only the API and the worker sit here alongside it.
  core:
  # Anything a browser may talk to.
  edge:

volumes:
  pgdata:
  storage_data:
  redis_data:
  loki_data:
  grafana_data:
