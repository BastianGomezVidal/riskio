# Shared environment blocks, and the shared backend image.
#
# Anchors (the `&name` / `*name` syntax) let the seven backend processes share
# one definition instead of repeating it. Compose merges them with the YAML
# merge key `<<`, so a change to the S3 config can never drift between two
# services. The `x-` prefix marks these as extension fields: Compose skips them
# as services.
x-storage-env: &storage-env
  STORAGE_DRIVER: s3
  # Internal address: resolved by Docker/Podman DNS, never by the browser.
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://storage:8333}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-riskio-avatars}
  # SeaweedFS accepts any credentials by default. Override both in .env when
  # pointing at a real S3 (AWS, MinIO) so the compose file stays provider-agnostic.
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-any}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-any}
  # Public address: what the browser uses to render an avatar. Different from
  # STORAGE_ENDPOINT on purpose, and the only one that needs a host-visible port.
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:${STORAGE_PORT:-8333}/${STORAGE_BUCKET:-riskio-avatars}}

# What the API gets instead of the credentials above. Separate anchor on
# purpose: the API used to merge in the S3 keys, and the whole point of the
# storage service is that it does not any more. Merging them back in would be
# a one-line mistake that undoes the extraction without failing anything.
# What the API knows about caching: only the address of the service. Kept apart
# from x-backend-env for the same reason as the storage one — a merge key is the
# easiest place in this file to accidentally hand out a connection string.
# Where the API finds the feeds service. Its own anchor for the same reason as
# the others: a merge key is the easiest place to hand out a connection.
x-feeds-client-env: &feeds-client-env
  FEEDS_SERVICE_URL: http://backend-feeds:3006
  # A real run fetches several NOAA feeds and writes rows, so this is generous
  # on purpose. Short enough that a wedged service is reported rather than left
  # to hang the request.
  FEEDS_SERVICE_TIMEOUT_MS: ${FEEDS_SERVICE_TIMEOUT_MS:-120000}

# Where the API reads storms from. It has no database connection for weather any
# more, which is the point: the dashboard's storms come over HTTP.
x-weather-client-env: &weather-client-env
  WEATHER_SERVICE_URL: http://backend-weather:3007
  WEATHER_SERVICE_TIMEOUT_MS: ${WEATHER_SERVICE_TIMEOUT_MS:-5000}

# Where the API asks "may this request proceed?". It holds no JWT_SECRET and
# reads no users table, so this URL is the whole of its access to authentication.
# Only the auth service holds JWT_SECRET, and it needs the OAuth and mailer
# settings with it. Kept as a named block so the API's environment can be read
# at a glance and seen not to include any of this.
x-api-only-env: &api-only-env
  DATABASE_URL: ${DATABASE_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:-}

x-auth-env-only: &auth-env-only
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  MAIL_FROM: ${MAIL_FROM:-Riskio <no-reply@riskio.local>}

x-auth-client-env: &auth-client-env
  AUTH_SERVICE_URL: http://backend-auth:3008
  AUTH_SERVICE_TIMEOUT_MS: ${AUTH_SERVICE_TIMEOUT_MS:-5000}

x-cache-client-env: &cache-client-env
  CACHE_SERVICE_URL: http://backend-cache:3005
  # Short, because every call sits in the request path. A cache hit measured
  # 8-12 ms over the wire, so a second of budget is generous; and a miss pays
  # the timeout twice, get and set, which is what turned a 0.5 s uncached
  # response into 4 s before the client learned to short-circuit.
  CACHE_SERVICE_TIMEOUT_MS: ${CACHE_SERVICE_TIMEOUT_MS:-1000}
  # How long to keep skipping the cache after a failure. Without it, failing
  # open is theoretical: the requests still work, they are just slower than if
  # the cache had never existed.
  CACHE_SERVICE_COOLDOWN_MS: ${CACHE_SERVICE_COOLDOWN_MS:-10000}

x-storage-client-env: &storage-client-env
  STORAGE_API_URL: http://backend-storage:3004
  STORAGE_API_TIMEOUT_MS: ${STORAGE_API_TIMEOUT_MS:-5000}

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  # REDIS_URL is not here any more. The cache service holds the only Redis
  # connection in the stack, and the API reaches it over HTTP; leaving it in
  # this anchor would hand every backend process a cache connection again and
  # undo the extraction without a single thing failing.
  # Outbound email, used only for the password reset link. `log` keeps the link
  # in the backend log instead of sending it, which is fine locally and unsafe
  # anywhere else. Set MAIL_TRANSPORT=smtp plus the SMTP_* values to send for
  # real; the API refuses to boot on smtp with an incomplete configuration.
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-riskio@example.com}
  # Telemetry. Both processes speak OTLP to the collector and nothing else, so
  # pointing traces at CloudWatch or X-Ray later is a change to the collector's
  # config and not to the app. service.name is fixed here so the service
  # extractions in Fase 6 do not relabel data that already exists.
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-riskio-api}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1}
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}

services:
  db:
    image: postgis/postgis:16-3.4
    runtime: runc
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only: reachable from the host for psql, not from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - core
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: docker.io/chrislusf/seaweedfs
    runtime: runc
    restart: unless-stopped
    # -ip.bind=0.0.0.0 is required: without it SeaweedFS binds a single
    # interface (whichever it detects last) instead of 0.0.0.0, so a service
    # attached only to the `core` network — the worker — gets ECONNREFUSED
    # while the API, on both networks, appears to work. -ip is left on
    # autodetect because that is the address SeaweedFS advertises to its own
    # master/volume/filer peers.
    command: server -s3 -s3.port=8333 -volume.max=100 -ip.bind=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8333/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Published on all interfaces on purpose: this is the only storage
      # address the browser can reach (STORAGE_PUBLIC_URL).
      - "${STORAGE_PORT:-8333}:8333"
    networks:
      # core so the API can talk to it by DNS, edge so it is reachable
      # from outside the host.
      - core
      - edge
    volumes:
      - storage_data:/data

  redis:
    image: docker.io/library/redis:7-alpine
    runtime: runc
    restart: unless-stopped
    ports:
      # Loopback only: no auth on a dev Redis, so never expose it broadly.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - core
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend-api:
    # All seven backend processes run the SAME image tag and differ only by
    # `command`. Without an explicit `image:` Compose derives one tag per service
    # name — seven identical 651 MB images — and `podman-compose build
    # backend-api` silently leaves `backend-auth` on yesterday's code, which
    # presents as a fix that does not work. Recreate all seven after a backend
    # build; an unnecessary recreate is cheap, the wrong one is the bug.
    image: localhost/riskio_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    restart: unless-stopped
    # No env_file on purpose. The API is a gateway: a database URL to run
    # migrations, a list of service URLs and CORS. Loading .env wholesale put
    # JWT_SECRET, the OAuth credentials and the mailer password in a process
    # that uses none of them, and no amount of removing them from the code
    # changed that.
    environment:
      <<: [*storage-client-env, *cache-client-env, *feeds-client-env, *weather-client-env, *auth-client-env, *api-only-env]
      PORT: 3000
    ports:
      - "${BACKEND_API_PORT:-3000}:3000"
    networks:
      - core
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      backend-storage:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The dashboard reads storms from here, so the API needs it to answer
      # /dashboard. /storms itself is served by the weather service directly.
      backend-weather:
        condition: service_healthy
      # Auth being unavailable means nothing can be authenticated, and that is
      # the intended behaviour rather than a failure to route around: the API
      # cannot verify a token on its own any more.
      backend-auth:
        condition: service_healthy

  # Own service: accounts, sessions, machine tokens and the user profile. The
  # only process that holds JWT_SECRET or reads the users table, and the only
  # one that can hash a password.
  backend-auth:
    # All seven backend processes run the SAME image tag and differ only by
    # `command`. Without an explicit `image:` Compose derives one tag per service
    # name — seven identical 651 MB images — and `podman-compose build
    # backend-api` silently leaves `backend-auth` on yesterday's code, which
    # presents as a fix that does not work. Recreate all seven after a backend
    # build; an unnecessary recreate is cheap, the wrong one is the bug.
    image: localhost/riskio_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    command: ["npm", "run", "start:auth"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: [*cache-client-env, *storage-client-env, *auth-env-only]
      AUTH_SERVICE_PORT: 3008
      OTEL_SERVICE_NAME: ${OTEL_AUTH_SERVICE_NAME:-riskio-auth}
    networks:
      - core
    depends_on:
      db:
        condition: service_healthy
      backend-cache:
        condition: service_started
      backend-storage:
        condition: service_started
    # Loopback only, and only so `dev.sh` can run the API on the host in
    # watch mode: a process outside the compose network cannot resolve
    # `backend-auth` and friends by DNS. Nothing outside this machine
    # can reach these.
    ports:
      - "127.0.0.1:${AUTH_PORT:-3008}:3008"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3008/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Own service: the read side of storms and advisories, which is what
  # /storms, /storms/:atcfId and /advisories/* are served from. The dashboard
  # reads it over HTTP, so the API holds no repository for these tables.
  backend-weather:
    # All seven backend processes run the SAME image tag and differ only by
    # `command`. Without an explicit `image:` Compose derives one tag per service
    # name — seven identical 651 MB images — and `podman-compose build
    # backend-api` silently leaves `backend-auth` on yesterday's code, which
    # presents as a fix that does not work. Recreate all seven after a backend
    # build; an unnecessary recreate is cheap, the wrong one is the bug.
    image: localhost/riskio_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    command: ["npm", "run", "start:weather"]
    restart: unless-stopped
    # No env_file: this reads storms and advisories and signs nothing. Loading
    # .env handed it the signing secret and both OAuth client secrets, which it
    # had no use for and no business holding.
    environment:
      <<: *cache-client-env
      DATABASE_URL: ${DATABASE_URL}
      WEATHER_SERVICE_PORT: 3007
      OTEL_SERVICE_NAME: ${OTEL_WEATHER_SERVICE_NAME:-riskio-weather}
    networks:
      - core
    depends_on:
      db:
        condition: service_healthy
      backend-cache:
        condition: service_started
    # Loopback only, and only so `dev.sh` can run the API on the host in
    # watch mode: a process outside the compose network cannot resolve
    # `backend-auth` and friends by DNS. Nothing outside this machine
    # can reach these.
    ports:
      - "127.0.0.1:${WEATHER_PORT:-3007}:3007"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Own service: the only process that reads NOAA and writes storms,
  # advisories, forecast points and warnings. It also holds the cron, which is
  # why backend-worker is gone — that container existed only to keep the
  # scheduler alive across an API restart, and now the scheduler lives next to
  # the ingestion it drives.
  backend-feeds:
    # All seven backend processes run the SAME image tag and differ only by
    # `command`. Without an explicit `image:` Compose derives one tag per service
    # name — seven identical 651 MB images — and `podman-compose build
    # backend-api` silently leaves `backend-auth` on yesterday's code, which
    # presents as a fix that does not work. Recreate all seven after a backend
    # build; an unnecessary recreate is cheap, the wrong one is the bug.
    image: localhost/riskio_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    command: ["npm", "run", "start:feeds"]
    restart: unless-stopped
    # No env_file, and the NHC_* values are spelled out rather than inherited:
    # this service polls NOAA and writes storms, and nothing about it needs the
    # signing secret or the OAuth credentials that .env was handing it.
    environment:
      <<: *cache-client-env
      DATABASE_URL: ${DATABASE_URL}
      NHC_BASE_URL: ${NHC_BASE_URL:-https://www.nhc.noaa.gov}
      NHC_TIMEOUT_MS: ${NHC_TIMEOUT_MS:-10000}
      FEEDS_SERVICE_PORT: 3006
      OTEL_SERVICE_NAME: ${OTEL_FEEDS_SERVICE_NAME:-riskio-feeds}
    networks:
      # core only, and no published port: nothing outside compose asks for an
      # ingestion run. The API does, over HTTP.
      - core
    depends_on:
      db:
        condition: service_healthy
      # Best-effort on the cache: the HTTP cache client fails open, so an
      # absent cache service must not stop ingestion from running. Anything with
      # a `condition` here would do the opposite of that.
      backend-cache:
        condition: service_started
    # Loopback only, and only so `dev.sh` can run the API on the host in
    # watch mode: a process outside the compose network cannot resolve
    # `backend-auth` and friends by DNS. Nothing outside this machine
    # can reach these.
    ports:
      - "127.0.0.1:${FEEDS_PORT:-3006}:3006"
    healthcheck:
      # Readiness really queries the database. A feeds service that cannot write
      # accepts trigger requests and then stores nothing, and the API waits for
      # this to be healthy, so a green stack could be ingesting nothing.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Own service, and the only holder of a Redis connection. Nothing waits for it
  # to be healthy: the API degrades to uncached reads instead of refusing to
  # start, which is the whole point of extracting it.
  backend-cache:
    # All seven backend processes run the SAME image tag and differ only by
    # `command`. Without an explicit `image:` Compose derives one tag per service
    # name — seven identical 651 MB images — and `podman-compose build
    # backend-api` silently leaves `backend-auth` on yesterday's code, which
    # presents as a fix that does not work. Recreate all seven after a backend
    # build; an unnecessary recreate is cheap, the wrong one is the bug.
    image: localhost/riskio_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    command: ["npm", "run", "start:cache"]
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CACHE_SERVICE_PORT: 3005
      OTEL_SERVICE_NAME: ${OTEL_CACHE_SERVICE_NAME:-riskio-cache}
    networks:
      - core
    depends_on:
      redis:
        condition: service_healthy
    # Loopback only, and only so `dev.sh` can run the API on the host in
    # watch mode: a process outside the compose network cannot resolve
    # `backend-auth` and friends by DNS. Nothing outside this machine
    # can reach these.
    ports:
      - "127.0.0.1:${CACHE_PORT:-3005}:3005"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Own service, own credentials, own blast radius. The API talks to it over
  # HTTP and no longer holds the S3 keys; the bucket policy and the shape of a
  # public URL live here and nowhere else.
  # Own service: the dashboard summary. The only service here with no database
  # credentials at all — the summary is assembled from the weather service over
  # HTTP and cached for 30s, so it owns no table and reads none. The env
  # contract is what keeps it that way.
  backend-dashboard:
    # All seven backend processes run the SAME image tag and differ only by
    # `command`. Without an explicit `image:` Compose derives one tag per service
    # name — seven identical 651 MB images — and `podman-compose build
    # backend-api` silently leaves `backend-auth` on yesterday's code, which
    # presents as a fix that does not work. Recreate all seven after a backend
    # build; an unnecessary recreate is cheap, the wrong one is the bug.
    image: localhost/riskio_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    command: ["npm", "run", "start:dashboard"]
    restart: unless-stopped
    environment:
      <<: *cache-client-env
      WEATHER_SERVICE_URL: http://backend-weather:3007
      WEATHER_SERVICE_TIMEOUT_MS: ${WEATHER_SERVICE_TIMEOUT_MS:-5000}
      DASHBOARD_SERVICE_PORT: 3009
      OTEL_SERVICE_NAME: ${OTEL_DASHBOARD_SERVICE_NAME:-riskio-dashboard}
    networks:
      - core
    depends_on:
      backend-cache:
        condition: service_started
      backend-weather:
        condition: service_healthy
    # Loopback only, and only so `dev.sh` can run the API on the host in
    # watch mode: a process outside the compose network cannot resolve
    # `backend-auth` and friends by DNS. Nothing outside this machine
    # can reach these.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3009}:3009"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3009/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend-storage:
    # All seven backend processes run the SAME image tag and differ only by
    # `command`. Without an explicit `image:` Compose derives one tag per service
    # name — seven identical 651 MB images — and `podman-compose build
    # backend-api` silently leaves `backend-auth` on yesterday's code, which
    # presents as a fix that does not work. Recreate all seven after a backend
    # build; an unnecessary recreate is cheap, the wrong one is the bug.
    image: localhost/riskio_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    runtime: runc
    command: ["npm", "run", "start:storage"]
    restart: unless-stopped
    # No env_file: the S3 block is the whole configuration, and the secrets in
    # .env were being delivered to a process that only ever speaks to a bucket.
    environment:
      <<: *storage-env
      STORAGE_API_PORT: 3004
      OTEL_SERVICE_NAME: ${OTEL_STORAGE_SERVICE_NAME:-riskio-storage}
    networks:
      # core only, and no published port: nothing outside the compose network
      # has any business uploading to a bucket, and an unauthenticated
      # write endpoint reachable from the host is a hole, not a convenience.
      - core
    depends_on:
      storage:
        condition: service_healthy
    # Loopback only, and only so `dev.sh` can run the API on the host in
    # watch mode: a process outside the compose network cannot resolve
    # `backend-auth` and friends by DNS. Nothing outside this machine
    # can reach these.
    ports:
      - "127.0.0.1:${STORAGE_PORT:-3004}:3004"
    healthcheck:
      # Readiness really talks to the bucket, so the API is never started
      # against a storage service that accepts uploads it cannot store.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      args:
        # Relative, so the API is same-origin and needs no CORS preflight. The
        # SPA's nginx proxies /api/ to the gateway and strips the prefix.
        #
        # Note the precedence: podman-compose substitutes from .env, so a
        # VITE_API_URL in .env wins over the default below. If the default here
        # and the value in .env disagree, .env is what gets built and the
        # default is a lie. Keep both on /api unless you are deliberately
        # pointing the SPA at a host somewhere else.
        #
        # This is a local-topology win: with the app and the API on different
        # hosts in production, preflights come back by design and the thing to
        # fix there is CORS with credentials.
        VITE_API_URL: ${VITE_API_URL:-/api}
        # The browser is not inside the compose network, so it sends to the
        # collector's loopback port. Empty disables browser tracing entirely:
        # the SDK is compiled in either way, it just does not register.
        VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
        # Compile-time, read by src/auth/session-context.tsx at build. Empty means
        # "use the defaults in that file", which is what these are set to; they
        # are spelled out so a deployment can override them without editing code.
        VITE_IDLE_TIMEOUT_MS: ${VITE_IDLE_TIMEOUT_MS:-}
        VITE_IDLE_WARNING_MS: ${VITE_IDLE_WARNING_MS:-}
    runtime: runc
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      # edge only: the SPA can reach the API, never the database or Redis.
      - edge
    depends_on:
      backend-api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel/config.yaml:ro,z
      # Per-container metrics via the podman socket are deliberately absent.
      # They were tried and do not work here: SELinux denies a container access
      # to /run/user/1000/podman/podman.sock even as root, and one broken
      # receiver takes the whole collector down with it, taking traces and host
      # metrics with it. Per-service resource usage is still available from the
      # app side: the Node runtime metrics that ship with auto-instrumentations
      # report process CPU and heap per service.
    networks:
      - core
    ports:
      # OTLP over HTTP on loopback, so the browser can send traces too
      # (Fase 6.2). Nothing is exposed off the host.
      - "127.0.0.1:${OTEL_PORT:-4318}:4318"

  jaeger:
    # v2, not the v1 all-in-one: v1 went end-of-life in December 2025. v2
    # configures storage in YAML, and the query API is /api/v3.
    image: docker.io/jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    # The config is mounted but not read unless the process is told to read it.
    # The image ships no /etc/jaeger directory at all and its entrypoint takes
    # no arguments, so without this flag Jaeger runs on the defaults compiled
    # into the binary and logs "Initializing storage 'some_storage'" no matter
    # what the file says. A correctly mounted file is not a used file.
    command: ["--config=file:/etc/jaeger/config.yml"]
    volumes:
      - ./deploy/jaeger.yml:/etc/jaeger/config.yml:ro,z
      # Matches directories.keys / directories.values in deploy/jaeger.yml.
      # :U is not optional: the process runs as uid 10001 and a fresh podman
      # volume is root:root 0755, so without it Jaeger dies at startup with
      # "Error Creating Dir ... permission denied".
      - jaeger_data:/badger:U,z
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    networks:
      - core

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    # Prometheus is a database, not a cache. It already writes a real TSDB to
    # /prometheus, but without a volume that directory lives in the container
    # layer, so `podman-compose down` or any --force-recreate takes every metric
    # with it. Which is how the web-vitals series kept disappearing: the data
    # was never missing, the database was being thrown away.
    #
    # Retention is Prometheus's default of 15d, written down so it is a decision
    # rather than an inherited surprise.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - core

  loki:
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/loki.yml:/etc/loki/loki.yml:ro,z
      - loki_data:/loki
    networks:
      - core

  # Holds the last audit result so it survives between runs.
  #
  # The audit is not a service and nobody runs it on a timer, but its metrics
  # went through the collector like everything else, which meant Prometheus saw
  # one sample and marked the series stale five minutes later. Verified: after a
  # run, all four audit_* series were already gone and the dashboard panels were
  # empty. Pushgateway is the shape that fits: last value wins, held until it is
  # replaced or deleted.
  #
  # --persistence.file is on because this container holds the thing the audit
  # panels are for; without it, a recreate loses the last result. One small
  # state file, and it only grows if audits are run without replacing the group.
  # Fully qualified like the jaeger and seaweedfs images: a short name that is not
  # already in the local store cannot be resolved without a TTY, so prom/pushgateway
  # failed on first `up` while prom/prometheus only worked because it was pulled earlier.
  pushgateway:
    image: docker.io/prom/pushgateway:v1.11.3
    restart: unless-stopped
    command:
      - --persistence.file=/data/metrics.db
      - --persistence.interval=5m
    volumes:
      - pushgateway_data:/data
    ports:
      - "127.0.0.1:${PUSHGATEWAY_PORT:-9091}:9091"
    networks:
      - core

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - core

networks:
  # Data tier. Only the API and the worker sit here alongside it.
  core:
  # Anything a browser may talk to.
  edge:

volumes:
  pgdata:
  storage_data:
  redis_data:
  loki_data:
  grafana_data:
  prometheus_data:
  pushgateway_data:
  jaeger_data:
