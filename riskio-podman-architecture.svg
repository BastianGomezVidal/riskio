<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1000" fill="#f6f7f9"/>

  <text x="40" y="38" font-size="22" font-weight="bold" fill="#0f172a">Riskio &#8211; how the podman-compose stack works</text>

  <!-- HOST boundary -->
  <rect x="90" y="170" width="1620" height="700" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="105" y="195" font-size="15" font-weight="bold" fill="#475569">HOST &#8211; podman + podman-compose</text>

  <!-- NETWORK boundary -->
  <rect x="150" y="250" width="1500" height="520" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="165" y="275" font-size="14" font-weight="bold" fill="#4338ca">podman network: riskio_default (bridge, 10.89.0.0/24)</text>
  <text x="165" y="293" font-size="12" fill="#6366f1">containers reach each other by service name: db, backend-api, backend-worker, frontend</text>

  <!-- Browser -->
  <rect x="440" y="70" width="680" height="80" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="460" y="93" font-size="14" font-weight="bold" fill="#92400e">Browser (your machine)</text>
  <text x="460" y="112" font-size="12" fill="#a16207">opens http://localhost:8080 (SPA) &#183; API calls to http://localhost:3000 (CORS enabled)</text>

  <!-- frontend -->
  <rect x="200" y="340" width="300" height="180" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="200" y="340" width="300" height="28" rx="8" fill="#7c3aed"/>
  <rect x="200" y="356" width="300" height="12" fill="#7c3aed"/>
  <text x="350" y="362" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">frontend</text>
  <text x="212" y="382" font-size="11.5" fill="#334155">nginx:1.27-alpine (riskio_frontend)</text>
  <text x="212" y="398" font-size="11.5" fill="#334155">serves built SPA (React + Vite)</text>
  <text x="212" y="414" font-size="11.5" fill="#334155">port: 0.0.0.0:8080 &#8594; :80</text>
  <text x="212" y="430" font-size="11.5" fill="#334155">depends_on backend-api</text>
  <text x="212" y="446" font-size="11.5" fill="#334155">VITE_API_URL=http://localhost:3000</text>

  <!-- backend-api -->
  <rect x="820" y="330" width="380" height="210" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="820" y="330" width="380" height="28" rx="8" fill="#2563eb"/>
  <rect x="820" y="346" width="380" height="12" fill="#2563eb"/>
  <text x="1010" y="352" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">backend-api</text>
  <text x="832" y="372" font-size="11.5" fill="#334155">NestJS API (riskio_backend-api)</text>
  <text x="832" y="388" font-size="11.5" fill="#334155">port: 0.0.0.0:3000 &#8594; :3000</text>
  <text x="832" y="404" font-size="11.5" fill="#334155">routes: /health, /auth/*, /storms</text>
  <text x="832" y="420" font-size="11.5" fill="#334155">JWT auth (JWT_SECRET from .env)</text>
  <text x="832" y="436" font-size="11.5" fill="#334155">healthcheck: wget :3000/health</text>
  <text x="832" y="452" font-size="11.5" fill="#334155">depends_on db (service_healthy)</text>
  <text x="832" y="468" font-size="11.5" fill="#334155">CORS: allows origin localhost:8080</text>

  <!-- db -->
  <rect x="1450" y="330" width="340" height="230" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="1450" y="330" width="340" height="28" rx="8" fill="#16a34a"/>
  <rect x="1450" y="346" width="340" height="12" fill="#16a34a"/>
  <text x="1620" y="352" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">db</text>
  <text x="1462" y="372" font-size="11.5" fill="#334155">postgis/postgis:16-3.4 (riskio_db_1)</text>
  <text x="1462" y="388" font-size="11.5" fill="#334155">PostgreSQL 16 + PostGIS</text>
  <text x="1462" y="404" font-size="11.5" fill="#334155">port: 0.0.0.0:5432 &#8594; :5432</text>
  <text x="1462" y="420" font-size="11.5" fill="#334155">database riskio &#183; user riskio</text>
  <text x="1462" y="436" font-size="11.5" fill="#334155">healthcheck: pg_isready</text>
  <text x="1462" y="452" font-size="11.5" fill="#334155">runs TypeORM migrations at boot</text>
  <text x="1462" y="468" font-size="11.5" fill="#334155">password: POSTGRES_PASSWORD</text>
  <text x="1462" y="484" font-size="11.5" fill="#334155">DATABASE_URL: riskio:***@db:5432/riskio</text>

  <!-- backend-worker -->
  <rect x="820" y="580" width="380" height="170" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <rect x="820" y="580" width="380" height="28" rx="8" fill="#d97706"/>
  <rect x="820" y="596" width="380" height="12" fill="#d97706"/>
  <text x="1010" y="602" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">backend-worker</text>
  <text x="832" y="622" font-size="11.5" fill="#334155">ingestion worker (riskio_backend-worker)</text>
  <text x="832" y="638" font-size="11.5" fill="#334155">same built image as backend-api</text>
  <text x="832" y="654" font-size="11.5" fill="#334155">cmd: npm run start:worker</text>
  <text x="832" y="670" font-size="11.5" fill="#334155">NOAA NHC polling scheduler</text>
  <text x="832" y="686" font-size="11.5" fill="#334155">no published ports (internal only)</text>
  <text x="832" y="702" font-size="11.5" fill="#334155">depends_on db</text>

  <!-- pgdata volume -->
  <rect x="1460" y="660" width="320" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1620" y="688" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">volume: riskio_pgdata</text>
  <text x="1620" y="706" font-size="11.5" fill="#475569" text-anchor="middle">persists DB data across compose</text>
  <text x="1620" y="724" font-size="11.5" fill="#475569" text-anchor="middle">down / up cycles</text>

  <!-- NOAA external -->
  <rect x="900" y="880" width="700" height="90" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="918" y="904" font-size="13" font-weight="bold" fill="#0f766e">External service: NOAA National Hurricane Center</text>
  <text x="918" y="924" font-size="11.5" fill="#115e59">https://www.nhc.noaa.gov (NHC_BASE_URL, NHC_TIMEOUT_MS)</text>
  <text x="918" y="942" font-size="11.5" fill="#115e59">polled by backend-worker; advisories ingested into the DB</text>

  <!-- arrows -->
  <polyline points="480,150 330,340" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="160" y="205" font-size="11.5" fill="#334155">GET / &#8594; serves SPA (port 8080)</text>

  <line x1="860" y1="150" x2="860" y2="330" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="875" y="245" font-size="11.5" fill="#334155">POST /auth/login, /storms</text>

  <line x1="1200" y1="440" x2="1450" y2="440" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1325" y="426" font-size="11.5" fill="#334155" text-anchor="middle">SQL (DATABASE_URL)</text>

  <line x1="1200" y1="670" x2="1450" y2="560" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1315" y="602" font-size="11.5" fill="#334155">SQL (DATABASE_URL)</text>

  <line x1="1620" y1="560" x2="1620" y2="660" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <polyline points="1010,750 1010,810 1330,810 1330,880" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1024" y="798" font-size="11.5" fill="#334155">HTTPS GET advisories (NOAA NHC)</text>

  <!-- footnotes -->
  <text x="170" y="790" font-size="11.5" fill="#475569">env_file: .env &#8212; POSTGRES_*, DATABASE_URL, JWT_SECRET, NHC_*, ADMIN_EMAILS=juanquindio@gmail.com, CORS_ORIGINS=http://localhost:8080</text>
  <text x="170" y="808" font-size="11.5" fill="#475569">restart: unless-stopped on all services &#8212; images built from backend/ and frontend/ Dockerfiles; no host binds, node_modules baked into the images</text>
</svg>