server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Compression was simply absent, so every visitor pulled ~1.18 MB of
    # uncompressed JS/CSS where the same payload is ~374 kB gzipped. nginx has
    # gzip off by default and this file replaces the image's default.conf
    # wholesale, so there was nothing to inherit.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # No image/* or already-compressed types: those are wasted CPU.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Content-hashed assets are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry HTML must never be cached so new deploys always land.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # The API, same origin as the page.
    #
    # The app used to call http://localhost:3000 directly while the page was
    # served from localhost:80, which made every single API call cross-origin
    # and therefore preflighted: 6 round trips for 3 pieces of data, measured
    # with scripts/audit/session-capture.mjs. Proxying on the same origin removes the
    # OPTIONS entirely. The OTLP endpoint stays on :4318 because the collector
    # is a different container, so 2 preflights remain for telemetry.
    #
    # The trailing slash on proxy_pass is load-bearing: it strips the /api
    # prefix, so /api/auth/login reaches the gateway as /auth/login. The
    # gateway serves its routes at the root, with no global prefix. Without the
    # slash the backend would receive /api/auth/login and 404.
    location /api/ {
        proxy_pass http://backend-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx defaults to 1m and the gateway's avatar upload allows 2 MB
        # (FileInterceptor limits.fileSize in users.controller.ts). Left at the
        # default, any avatar over 1 MB fails with 413 at the proxy and the
        # backend never sees the request, so this has to track that number.
        client_max_body_size 2m;

        # /dashboard/summary is ~470 ms cold but does real work; the default 60s
        # read timeout is plenty, and these are here to be explicit about it.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # All other routes: revalidate on every load, then fall back to the SPA entry.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}