server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Compression was simply absent, so every visitor pulled ~1.18 MB of
    # uncompressed JS/CSS where the same payload is ~374 kB gzipped. nginx has
    # gzip off by default and this file replaces the image's default.conf
    # wholesale, so there was nothing to inherit.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # No image/* or already-compressed types: those are wasted CPU.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Content-hashed assets are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry HTML must never be cached so new deploys always land.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # All other routes: revalidate on every load, then fall back to the SPA entry.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}