# OpenTelemetry Collector — the single OTLP endpoint for the whole stack.
#
# The app, the worker and the browser all talk OTLP to here and nowhere else.
# Changing where telemetry lands is a change to this file, not to the app:
# sending the same traces to CloudWatch or X-Ray later means adding an
# exporter, not editing application code.
#
# Used instead of the image's default config so the receivers we depend on are
# explicit and reviewable.

receivers:
  # Application and worker traces and metrics.
  #
  # The browser sends here too, which is the one deliberate break in the
  # "telemetry never joins edge" rule: a browser is not inside the compose
  # network, so its OTLP endpoint has to be reachable and has to answer a
  # preflight. Origins are listed explicitly rather than reflected, because this
  # endpoint accepts writes from anything that reaches it.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # These have to match how the app is actually *served*, not how a dev
          # server might serve it. This list was localhost/5173/8080 while the
          # real app is served from riskio.test on port 80, so the browser's
          # preflight got a 204 with no Access-Control-Allow-Origin and silently
          # dropped every span and every web vital. There was no error anywhere:
          # the SDK reported no failures, Loki simply had no riskio-web stream.
          allowed_origins:
            - "http://localhost"
            - "http://localhost:5173"
            - "http://localhost:8080"
            # vite preview. Same app, different origin, so without this the
            # browser rejects the export and a test against a locally built
            # bundle looks like broken telemetry.
            - "http://localhost:4173"
            - "http://riskio.test"
            - "https://riskio.test"
          allowed_headers: ["Content-Type", "traceparent", "tracestate"]
          max_age: 900

  # Infrastructure: the host itself. CPU, memory, disk, network and filesystem
  # for this machine, which is what tells you whether a slow request was the
  # application or the box.
  hostmetrics:
    # The default is 60s, which on a dev machine is long enough to look like
    # the receiver is broken. 20s keeps the host visible while working.
    collection_interval: 20s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      load: {}

processors:
  # Defence in depth against credentials reaching the log store.
  #
  # The app already stops forwarding headers, and Loki is told not to index
  # them. This is the third layer, and the one that still holds if either of the
  # other two is later changed by someone who did not know what was at stake: a
  # JWT deleted here cannot be persisted or indexed no matter how Loki is
  # configured. Cheap, and it fails safe.
  attributes/sanitize:
    actions:
      - key: req_headers_authorization
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: req_headers_cookie
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: res_headers_set_cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete

  # Only safe because every span of a trace lands on this one instance. Tail
  # sampling is a per-trace decision made from the complete set of spans, so a
  # second collector, or any load balancer in front of several, would show
  # partial traces: half the spans sampled as "success" and half arriving after
  # the decision. If this ever scales out, route by trace_id first, so all
  # spans of a trace reach the same instance.
  # Sampling decided when the operation finishes, not when it starts.
  #
  # A head-based sampler has to choose at the first span and cannot know how the
  # request ends, so a fixed ratio either throws away the errors or keeps every
  # failed request. Tail sampling waits for the whole trace, keeps all of it when
  # any span is an error, and keeps a share of the rest.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 20
    policies:
      # Anything that failed, in full. The app's own TraceErrorInterceptor is
      # what sets ERROR on the server span, so a 500 shows up here even though
      # the HTTP span still reports the status code in its own attribute.
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Slow traces, in full. A request that took its time is the one you will
      # be asked about afterwards, and by the "normal" policy below it would be
      # thrown away 80% of the time like any other success — which is how a
      # performance problem becomes invisible exactly when someone reports it.
      #
      # 250 ms is a dev-scale threshold, but read what it actually measures: a
      # cache miss, not a slow request. /dashboard/summary is ~470 ms cold and
      # 2-4 ms on a hit, because dashboard.service.ts wraps it in getOrSet with
      # a 30 s TTL. So today this keeps the cold calls and the concurrent
      # bursts and samples the cached ones, which is the useful half: a cached
      # trace shows no query and tells you nothing about the work.
      #
      # It stops meaning anything in 6.4. Once the cache is cut, every dashboard
      # request does the real query, every one clears 250 ms, and this route
      # silently stops being sampled at all. Revisit the threshold in the same
      # change that removes the cache, with a real percentile rather than this.
      - name: slow
        type: latency
        latency:
          threshold_ms: 250
      # Everything else at a share. Set to 100 in development when you want to
      # see every navigation.
      - name: successes
        type: probabilistic
        probabilistic:
          sampling_percentage: 20

  # Bound the collector's own memory before the batch queue does.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Traces go to Jaeger, which accepts OTLP directly.
  # Loki 3.x speaks OTLP natively, so logs travel the same path as traces and
  # metrics instead of needing a filelog agent with access to podman's store.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    # Jaeger may not be up yet when the collector starts, so queue and retry
    # rather than drop the first traces.
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Prometheus is pull-based and cannot receive a push, so the collector
  # exposes the metrics and Prometheus scrapes this endpoint.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    # Logs never reach Jaeger, which would drop them. They go straight to Loki's
    # OTLP endpoint, carrying the same resource attributes as the traces, so the
    # same service name filters both in Grafana.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
