# OpenTelemetry Collector — the single OTLP endpoint for the whole stack.
#
# The app, the worker and the browser all talk OTLP to here and nowhere else.
# Changing where telemetry lands is a change to this file, not to the app:
# sending the same traces to CloudWatch or X-Ray later means adding an
# exporter, not editing application code.
#
# Used instead of the image's default config so the receivers we depend on are
# explicit and reviewable.

receivers:
  # Application and worker traces and metrics.
  #
  # The browser sends here too, which is the one deliberate break in the
  # "telemetry never joins edge" rule: a browser is not inside the compose
  # network, so its OTLP endpoint has to be reachable and has to answer a
  # preflight. Origins are listed explicitly rather than reflected, because this
  # endpoint accepts writes from anything that reaches it.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost"
            - "http://localhost:5173"
            - "http://localhost:8080"
          allowed_headers: ["Content-Type", "traceparent", "tracestate"]
          max_age: 900

  # Infrastructure: the host itself. CPU, memory, disk, network and filesystem
  # for this machine, which is what tells you whether a slow request was the
  # application or the box.
  hostmetrics:
    # The default is 60s, which on a dev machine is long enough to look like
    # the receiver is broken. 20s keeps the host visible while working.
    collection_interval: 20s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
      load: {}

processors:
  # Defence in depth against credentials reaching the log store.
  #
  # The app already stops forwarding headers, and Loki is told not to index
  # them. This is the third layer, and the one that still holds if either of the
  # other two is later changed by someone who did not know what was at stake: a
  # JWT deleted here cannot be persisted or indexed no matter how Loki is
  # configured. Cheap, and it fails safe.
  attributes/sanitize:
    actions:
      - key: req_headers_authorization
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: req_headers_cookie
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: res_headers_set_cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete

  # Sampling decided when the operation finishes, not when it starts.
  #
  # A head-based sampler has to choose at the first span and cannot know how the
  # request ends, so a fixed ratio either throws away the errors or keeps every
  # failed request. Tail sampling waits for the whole trace, keeps all of it when
  # any span is an error, and keeps a share of the rest.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 20
    policies:
      # Anything that failed, in full. The app's own TraceErrorInterceptor is
      # what sets ERROR on the server span, so a 500 shows up here even though
      # the HTTP span still reports the status code in its own attribute.
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Everything else at a share. Set to 100 in development when you want to
      # see every navigation.
      - name: successes
        type: probabilistic
        probabilistic:
          sampling_percentage: 20

  # Bound the collector's own memory before the batch queue does.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Traces go to Jaeger, which accepts OTLP directly.
  # Loki 3.x speaks OTLP natively, so logs travel the same path as traces and
  # metrics instead of needing a filelog agent with access to podman's store.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    # Jaeger may not be up yet when the collector starts, so queue and retry
    # rather than drop the first traces.
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Prometheus is pull-based and cannot receive a push, so the collector
  # exposes the metrics and Prometheus scrapes this endpoint.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    # Logs never reach Jaeger, which would drop them. They go straight to Loki's
    # OTLP endpoint, carrying the same resource attributes as the traces, so the
    # same service name filters both in Grafana.
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
