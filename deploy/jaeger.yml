# Jaeger v2. Replaces the v1 all-in-one, which reached end-of-life in December
# 2025 and printed a deprecation banner on every start.
#
# The reason for moving rather than for keeping v1: v1's badger storage cannot
# be made to persist. There is no BADGER_* variable in `all-in-one env`, no
# flag, and no entry in print-config, because the options are registered by the
# storage factory at runtime. Left alone it wrote to a temp directory
# ("Dir":"/tmp/badger2014150244") and lost every trace on restart. v2 configures
# storage in YAML, where the directory and ephemeral=false are both stated.
#
# OTLP is served on the standard 4317/4318, so the collector's otlp/jaeger
# exporter keeps working unchanged, and the query UI stays on 16686 so the
# Grafana datasource and the browser keep their URLs.
#
# Storage layout, and why it is this way:
#
#   Two different names appear below and they are not interchangeable. `badger`
#   under jaeger_storage.backends REGISTERS a storage backend; `traces: badger`
#   and `trace_storage: badger` SELECT that registered one. Renaming one of
#   them breaks the link, and the failure surfaces as "cannot find factory for
#   trace storage <name>" at startup rather than as an empty store.
#
#   The path is /badger/*, set explicitly. The default is relative to the
#   binary and resolves to /cmd/jaeger/data/keys, which works but hides the
#   location. `directory` is not the key -- the key is `directories`, with
#   `keys` and `values` under it, and passing `directory` is rejected by
#   `validate`.
#
#   Those directories must be writable by uid 10001. A fresh podman volume is
#   root:root 0755, so without `:U` on the mount, Jaeger dies at startup with
#   "Error Creating Dir ... permission denied".
#
#   ttl.spans matches the 15d Prometheus retention in deploy/prometheus.yml, so
#   traces and metrics are not silently kept for different lengths of time.
#
#   Badger is not shared across processes here, and that is deliberate. Badger
#   cannot be opened by a collector and a query in separate processes, and this
#   is why the Jaeger docs steer split deployments to jaeger-remote-storage
#   instead. Nothing of that applies: the OTLP receiver, jaeger_storage and
#   jaeger_query are three extensions of one `service:`, so one process owns the
#   database. `ps` in the container shows a single `jaeger-linux`, and a trace
#   read back after a restart is the practical proof that both ends are on the
#   same database. If this ever splits into separate deployments, this file has
#   to become jaeger-remote-storage, not a shared volume.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: badger

extensions:
  jaeger_storage:
    backends:
      badger:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/data
          ephemeral: false
          ttl:
            spans: 360h
  jaeger_query:
    storage:
      traces: badger
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
