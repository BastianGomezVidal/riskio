auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      # v13 plus TSDB is what carries structured metadata. Both are required;
      # without them Loki silently downgrades metadata to labels.
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  # Required for the Push API to accept a third element per entry as structured
  # metadata instead of folding it into the stream labels.
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
