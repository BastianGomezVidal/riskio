# Prometheus scrapes the collector rather than receiving a push: it is
# pull-based. The collector is the single place metrics land, and it exposes
# them on :8889 after converting OTel resource attributes into labels.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
