name: CI

# Runs on the remote as well as locally. The gate is the same one `./check.sh`
# runs, so a green local run means a green run here; there is no second list of
# commands to keep in sync.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # Typecheck, oxlint, tests, coverage, knip, build. Coverage thresholds live
      # in backend/vitest.config.ts, so a drop below them fails this step.
      - name: Typecheck, lint, tests, coverage, dead code, build
        run: ./check.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

      # The numbers on the commit, readable without opening an artifact.
      # First-party `github-script` rather than a coverage-report action: the
      # popular ones expect a Vite config, and this project's coverage comes
      # from a NestJS/Vitest run that has no vite.config at all.
      - name: Comment coverage on the commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const t = JSON.parse(
              fs.readFileSync('backend/coverage/coverage-summary.json', 'utf8')
            ).total;
            const marker = '<!-- backend-coverage -->';
            const row = (k, v) => `| ${k} | ${v} |`;
            const body = [
              marker,
              '## Backend coverage',
              '',
              '| Metric | % |',
              '| --- | --- |',
              row('Lines', t.lines.pct),
              row('Statements', t.statements.pct),
              row('Functions', t.functions.pct),
              row('Branches', t.branches.pct),
              '',
              `_${t.lines.covered} of ${t.lines.total} lines. Thresholds live in \`backend/vitest.config.ts\`._`,
            ].join('\n');

            const { owner, repo, sha } = context;
            // Commit comments live under the commits API. The issues API
            // (issues/{sha}/comments) 404s for a commit SHA even with a
            // token that can read the commit itself.
            const { data: comments } =
              await github.rest.repos.listCommitComments({
                owner, repo, commit_sha: sha,
              });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.repos.updateCommitComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner, repo, commit_sha: sha, body,
              });
            }

  # A committed snapshot, so the README and the repository always carry the
  # measured numbers rather than a claim someone has to re-verify by hand.
  # It is a report, not a gate: the gate is the threshold in the check job above.
  coverage-snapshot:
    name: Coverage snapshot
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        run: npm run coverage

      - name: Write the snapshot
        run: |
          mkdir -p coverage-metrics
          node -e "
            const t = require('./backend/coverage/coverage-summary.json').total;
            const pct = (n) => Number(n.toFixed(2));
            const out = {
              lines: pct(t.lines.pct),
              statements: pct(t.statements.pct),
              functions: pct(t.functions.pct),
              branches: pct(t.branches.pct),
              coveredLines: t.lines.covered,
              totalLines: t.lines.total,
            };
            require('fs').writeFileSync(
              'coverage-metrics/summary.json',
              JSON.stringify(out, null, 2) + '\n',
            );
            console.log('coverage:', JSON.stringify(out));
          "

      - name: Commit if it changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: update backend coverage snapshot'
          file_pattern: 'coverage-metrics/summary.json'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
