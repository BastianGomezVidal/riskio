name: CI

# Runs on the remote as well as locally. The gate is the same one `./scripts/check.sh`
# runs, so a green local run means a green run here; there is no second list of
# commands to keep in sync.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest

    # The contract and integration suites boot the real Nest app against a real
    # Postgres: `test/setup-integration.ts` drops and recreates `riskio_test`
    # and lets the app's migrations run. There was no service here, so both
    # suites were skipped on every run this workflow had ever produced and the
    # job still went green. Seven files, 31 integration tests and 12 contract
    # tests, verified by nobody.
    #
    # This must be `postgis`, not `postgres`. Migration
    # 1888240000000-AddStormGeometry runs `CREATE EXTENSION postgis` and creates
    # a `geography(LineString,4326)` column; plain Postgres has neither, so the
    # migration fails and every suite that migrates fails behind it. Same image
    # and tag as `db:` in docker-compose.yml, for the same reason.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: riskio
          POSTGRES_PASSWORD: riskio_dev_password
          POSTGRES_DB: riskio
        ports:
          - 5432:5432
        # --wait semantics: without a health check the first suite to connect
        # races the database and fails intermittently. A test that fails
        # sometimes is worse than one that fails always, because it teaches
        # people to re-run instead of to fix.
        options: >-
          --health-cmd "pg_isready -U riskio -d riskio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # Typecheck, oxlint, tests, coverage, knip, build, and the two suites that
      # need the Postgres service above: contract and integration. Coverage
      # thresholds live in backend/vitest.config.ts, so a drop below them fails
      # this step.
      - name: Typecheck, lint, tests, coverage, dead code, build
        run: ./scripts/check.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

      # The numbers on the commit, readable without opening an artifact.
      #
      # Done with `gh api` rather than a coverage-report action: the popular
      # ones expect a Vite frontend and this coverage comes from a NestJS
      # Vitest run that has no vite.config. `gh api` also takes literal REST
      # paths, so there are no route templates or generated method names to
      # depend on. Both routes below were exercised against the real API.
      - name: Comment coverage on the commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          body="$(node -e '
            const t = require("./backend/coverage/coverage-summary.json").total;
            const row = (k, v) => `| ${k} | ${v} |`;
            process.stdout.write([
              "<!-- backend-coverage -->",
              "## Backend coverage",
              "",
              "| Metric | % |",
              "| --- | --- |",
              row("Lines", t.lines.pct),
              row("Statements", t.statements.pct),
              row("Functions", t.functions.pct),
              row("Branches", t.branches.pct),
              "",
              `_${t.lines.covered} of ${t.lines.total} lines. Thresholds live in \`backend/vitest.config.ts\`._`,
            ].join("\n"));
          ')"

          # Commit comments are a resource of their own: the issues route
          # (issues/{sha}/comments) 404s for a commit SHA. Reuse the previous
          # comment by its marker so a re-run does not add another one.
          existing="$(gh api "repos/$REPO/commits/$SHA/comments" \
            --jq 'map(select(.body | contains("<!-- backend-coverage -->"))) | first | .id // empty')"

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/comments/$existing" \
              -f body="$body" >/dev/null
            echo "updated commit comment $existing"
          else
            gh api --method POST "repos/$REPO/commits/$SHA/comments" \
              -f body="$body" >/dev/null
            echo "created commit comment"
          fi

  # A committed snapshot, so the README and the repository always carry the
  # measured numbers rather than a claim someone has to re-verify by hand.
  # It is a report, not a gate: the gate is the threshold in the check job above.
  coverage-snapshot:
    name: Coverage snapshot
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        run: npm run coverage

      - name: Write the snapshot
        run: |
          mkdir -p coverage-metrics
          node -e "
            const t = require('./backend/coverage/coverage-summary.json').total;
            const pct = (n) => Number(n.toFixed(2));
            const out = {
              lines: pct(t.lines.pct),
              statements: pct(t.statements.pct),
              functions: pct(t.functions.pct),
              branches: pct(t.branches.pct),
              coveredLines: t.lines.covered,
              totalLines: t.lines.total,
            };
            require('fs').writeFileSync(
              'coverage-metrics/summary.json',
              JSON.stringify(out, null, 2) + '\n',
            );
            console.log('coverage:', JSON.stringify(out));
          "

      - name: Commit if it changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: update backend coverage snapshot'
          file_pattern: 'coverage-metrics/summary.json'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
